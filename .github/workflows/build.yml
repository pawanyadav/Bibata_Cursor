name: Build Bibata Cursor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          pip install clickgen

      - name: Build cursor
        run: python build_linux.py --theme Bibata-Modern-Black-Orange --size 16

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bibata-Modern-Black-Orange-16
          path: themes/Bibata-Modern-Black-Orange
